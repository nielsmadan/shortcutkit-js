[package]
name = "tauri-plugin-shortcutkit"
version = "0.0.0"
description = "Tauri backend for ShortcutKit: shortcut state persistence, global hotkeys, keyboard layout and system shortcuts."
edition.workspace = true
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nielsmadan/shortcutkit-js"
homepage = "https://github.com/nielsmadan/shortcutkit-js/tree/main/packages/tauri#readme"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "shortcuts", "hotkeys", "keyboard"]
links = "tauri-plugin-shortcutkit"
exclude = [
  "/dist",
  "/guest-js",
  "/node_modules",
  "/test",
  "/package.json",
  "/tsconfig.json",
  "/tsdown.config.ts",
]

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", default-features = false }
tauri-plugin-global-shortcut = "2.4.1"

[dev-dependencies]
tempfile = "=3.27.0"
tauri = { version = "2.12.4", default-features = false, features = ["test"] }
