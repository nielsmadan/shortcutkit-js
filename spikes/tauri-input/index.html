<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortcutKit Input Spike</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>ShortcutKit input spike</h1>
      <div id="info"></div>
      <fieldset id="mode">
        <legend>Page keydown handling</legend>
        <label><input type="radio" name="mode" value="pass" checked /> Let through</label>
        <label
          ><input type="radio" name="mode" value="prevent" /> preventDefault on every key</label
        >
      </fieldset>
      <button id="save">Save results</button>
      <span id="saved"></span>
    </header>

    <main>
      <section>
        <h2>Steps</h2>
        <ol id="steps"></ol>
      </section>

      <section>
        <h2>Fields</h2>
        <div class="fields">
          <input id="field-input" placeholder="input" />
          <textarea id="field-textarea" placeholder="textarea"></textarea>
          <div id="field-editable" contenteditable="true">contenteditable</div>
        </div>
        <div class="row">
          <button id="change-accelerator">Change "Cmd+Shift+U item" to CmdOrCtrl+Shift+I</button>
        </div>
        <div class="row">
          <input id="global-input" value="CommandOrControl+Alt+Shift+U" />
          <button id="global-register">Register global</button>
          <button id="global-unregister">Unregister all</button>
        </div>
      </section>

      <section id="log-section" tabindex="0">
        <h2>Event log <small>(click here to focus the page without a text field)</small></h2>
        <table>
          <thead>
            <tr>
              <th>t</th>
              <th>source</th>
              <th>type</th>
              <th>key</th>
              <th>code</th>
              <th>mods</th>
              <th>flags</th>
              <th>target</th>
            </tr>
          </thead>
          <tbody id="log"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
