<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortcutKit Tauri Example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 1000px;
        padding: 1rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      section {
        border: 1px solid #8888;
        border-radius: 6px;
        margin: 1rem 0;
        padding: 0 1rem 0.5rem;
      }
      h2 {
        font-size: 1rem;
      }
      h3 {
        font-size: 0.9rem;
      }
      th,
      td {
        border-bottom: 1px solid #8888;
        padding: 0.25rem 0.5rem;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
